[project]
name = "claude-cli"
version = "0.1.0"
description = "Hardened wrapper around the local `claude -p` CLI (subscription auth), + JSON extraction and response cache"
requires-python = ">=3.12"
dependencies = []  # stdlib only, on purpose

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
