[project]
name = "claude-subprocess"
version = "0.1.4"
license = "MIT"
readme = "README.md"
authors = [{ name = "Daniil Petrov" }]
description = "Hardened Python wrapper for the local Claude Code CLI (claude -p): sync/async, streaming, cache. Stdlib-only."
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []  # stdlib only, on purpose

[project.urls]
Homepage = "https://github.com/octrow/claude-cli"
Issues = "https://github.com/octrow/claude-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff==0.17.3", "ty==0.0.95"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100  # the code was already written to ~100; only 6 lines were longer

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 80
ignore_names = ["auto"]  # pytest fixture requested for its env side effect, never read
