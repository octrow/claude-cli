<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900" role="img" aria-labelledby="t d">
<title id="t">claude-subprocess</title>
<desc id="d">Call claude -p from Python on your Claude Code subscription. Below: the real argv build_args() produces for model haiku: no tools, no slash commands, user settings only, an empty strict MCP config, and never --bare.</desc>
<rect width="600" height="900" rx="20" fill="#121517"/>
<text x="40" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5CC6B6" letter-spacing="2">PYTHON ≥3.12 · STDLIB ONLY · MIT</text>
<text x="37" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" fill="#E6E8EA" font-weight="800">claude-subprocess</text>
<text x="40" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#E6E8EA" font-weight="600">Call claude -p from Python</text>
<text x="40" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#A1A9B0">on your Claude Code subscription,</text>
<text x="40" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" fill="#A1A9B0">with the risky flags locked down.</text>
<rect x="40" y="290" width="440" height="58" rx="12" fill="#0B0D0E"/>
<text x="62" y="327" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">run_claude(prompt, model=&quot;haiku&quot;)</text>
<text x="40" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5CC6B6">→ text · cost_usd · raw envelope</text>
<rect x="30" y="430" width="540" height="440" rx="16" fill="#1A1F22" stroke="#2F373B" stroke-width="2"/>
<text x="54" y="468" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#A1A9B0" letter-spacing="1">ARGV · build_args(model=&quot;haiku&quot;)</text>
<text x="54" y="506" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">omniroute run claude --</text>
<text x="54" y="538" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">-p --model haiku --effort low</text>
<text x="54" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">--output-format json</text>
<text x="54" y="602" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">--no-session-persistence</text>
<text x="54" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">--tools &quot;&quot;</text>
<text x="546" y="634" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5CC6B6" text-anchor="end">← no tools</text>
<text x="54" y="666" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">--disable-slash-commands</text>
<text x="54" y="698" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">--setting-sources user</text>
<text x="54" y="730" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">--strict-mcp-config</text>
<text x="54" y="762" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#E6E8EA">--mcp-config mcp-empty.json</text>
<text x="546" y="762" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5CC6B6" text-anchor="end">← empty</text>
<line x1="54" y1="796" x2="546" y2="796" stroke="#2F373B" stroke-width="2"/>
<text x="54" y="834" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#F2A066" font-weight="700">--bare</text>
<line x1="54" y1="827" x2="126" y2="827" stroke="#F2A066" stroke-width="2"/>
<text x="546" y="834" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#F2A066" text-anchor="end">never sent: breaks OAuth</text>
</svg>
